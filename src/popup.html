<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caveatly</title>
<link rel="stylesheet" href="styles/styles.css">
<style>
  /* Pin width in the initial stylesheet so Chrome sizes the action popup
     to the report, not the browser default/max (otherwise a 380px column
     sits in a huge empty panel). */
  html, body {
    margin: 0;
    padding: 0;
    width: 380px;
    width: var(--popup-width);
    min-width: 380px;
    min-width: var(--popup-width);
    max-width: 380px;
    max-width: var(--popup-width);
    background: var(--surface-page);
  }
  html[data-view="report"],
  html[data-view="report"] body {
    width: var(--panel-width);
    min-width: var(--panel-width);
    max-width: var(--panel-width);
  }
  body {
    font-family: var(--font-sans);
    overflow-x: hidden;
    overflow-y: auto;
  }
  #root { width: 100%; }
  ::selection { background: var(--marker-yellow); color: var(--ink-950); }
  .fp-text-button {
    flex: 0 0 auto; padding: 4px 6px; margin-right: -6px;
    background: none; border: none; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-link); font: 600 12.5px var(--font-sans);
  }
  .fp-text-button:hover { color: var(--text-link-hover); text-decoration: underline; text-underline-offset: 3px; }
  .fp-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 9px;
    background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 999px;
    color: var(--text-body); font: 500 12.5px var(--font-sans); cursor: pointer;
  }
  .fp-chip svg { color: var(--text-muted); }
  .fp-chip:hover { border-color: var(--border-strong); }
  .fp-chip:hover svg { color: var(--text-strong); }
  .fp-chip:focus-visible,
  .fp-text-button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .fp-input {
    flex: 1; min-width: 0; height: var(--control-md); padding: 0 12px;
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    background: var(--surface-card); color: var(--text-strong);
    font: 13px var(--font-mono); outline: none;
  }
  .fp-input::placeholder { color: var(--text-muted); }
  .fp-input:focus { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-tint); }
  .fp-segment {
    cursor: pointer; padding: 5px 12px; min-height: 30px; border-radius: 999px;
    border: 1px solid var(--border-default); background: var(--surface-card); color: var(--text-body);
    font: 600 13px var(--font-sans);
  }
  .fp-segment:hover { border-color: var(--border-strong); }
  .fp-segment[aria-checked="true"] { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }
  .fp-segment:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .fp-rule {
    display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; margin-top: 4px;
    background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  }
  .fp-rule code {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 12px var(--font-mono); color: var(--text-body);
  }
  .fp-icon-small {
    display: grid; place-items: center; width: 26px; height: 26px; flex: 0 0 auto;
    background: none; border: none; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted);
  }
  .fp-icon-small:hover { background: var(--surface-sunken); color: var(--text-strong); }
  .fp-icon-small:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .fp-progress { animation: fp-sweep 1.4s var(--ease-in-out) infinite alternate; }
  @keyframes fp-sweep {
    from { width: 12%; }
    to { width: 88%; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="popup.js"></script>
</body>
</html>
